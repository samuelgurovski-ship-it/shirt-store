<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Shop all shirts — Fieldwork Shirt Co.</title>
  <meta name="description" content="Heavyweight tees, pocket tees, long sleeves and oxford button-downs.">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/styles.css">
</head>
<body data-page="shop" data-root="">
<main id="main">
  <div class="page-head"><div class="wrap">
    <h1 class="display" style="font-size:clamp(2.2rem,5vw,3.6rem)">All shirts</h1>
    <p>Free shipping over $75. Free returns within 30 days.</p>
  </div></div>
  <section class="section" style="padding-top:32px">
    <div class="wrap">
      <div class="filters" role="group" aria-label="Filter by type">
        <button class="chip" data-filter="all" aria-pressed="true">All</button>
        <button class="chip" data-filter="tee" aria-pressed="false">T-shirts</button>
        <button class="chip" data-filter="long" aria-pressed="false">Long sleeve</button>
        <button class="chip" data-filter="button" aria-pressed="false">Button-downs</button>
      </div>
      <div class="grid" data-products></div>
    </div>
  </section>
</main>
<script src="assets/main.js"></script>
</body>
</html>
